<script>
var KEY="bassarizik1";var S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
var now=Date.now();
function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}
function F(n){return (n||0).toLocaleString("fr-FR")+" F"}
function escA(s){return esc(s).replace(/"/g,"&quot;")}
var name=new URLSearchParams(location.search).get("n")||"";
var me=S.user&&S.user.role==="artiste"?S.user.name:"";
var isMe=!!name&&name===me;
function badgeOf(n){var p=(S.promo||{})[n];return ((p&&p+7*864e5<=Date.now())||(S.autoCert||{})[n])?'<span class="vb" title="Artiste certifié" aria-label="Artiste certifié">✔</span>':''}
function hostOk(n){return ((S.host||{})[n]||0)>now}
function shareOf(x,n){if(!x.sp)return x.a===n?1:0;var e=x.sp.filter(function(s){return s.n===n})[0];return e?e.p/100:0}
function inCat(x){if(shareOf(x,name)<=0)return false;if(x.rel&&x.rel>now&&!isMe)return false;if(x.r>=3)return false;if(x.vs&&x.vs!=="ok")return false;return true}
function cover(x){return x.cv&&x.cv.indexOf("data:image/")===0?'<img class="cv" alt="" src="'+x.cv+'">':'<div class="cv" aria-hidden="true">'+esc(String(x.t||"?").charAt(0).toUpperCase())+'</div>'}
function rankOf(){var m=new Date().toISOString().slice(0,7),a={};
(S.sales||[]).forEach(function(q){if(new Date(q.at).toISOString().slice(0,7)!==m)return;a[q.a]=a[q.a]||0;a[q.a]+=10});
(S.plays||[]).forEach(function(q){if(new Date(q.at).toISOString().slice(0,7)!==m)return;a[q.a]=a[q.a]||0;a[q.a]+=1});
var arr=Object.keys(a).sort(function(x,y){return a[y]-a[x]});var i=arr.indexOf(name);return {pos:i<0?0:i+1,score:a[name]||0}}
function render(){
if(!name){document.getElementById("prof").innerHTML='<p class="note">Aucun artiste sélectionné.</p>';return}
var photo=(S.photos||{})[name];
var bio=(S.bios||{})[name]||"";
var songs=(S.songs||[]).filter(function(x){return inCat(x)});
var albums=(S.albums||[]).filter(function(al){return al.a===name&&(!al.vs||al.vs==="ok")&&(!al.rel||al.rel<=now||isMe)});
var sales=(S.songs||[]).filter(function(x){return shareOf(x,name)>0}).reduce(function(s,x){return s+(x.s||0)},0);
var r=rankOf();
document.title=name+" · BASSARI-ZIK";
document.getElementById("prof").innerHTML=(photo?'<img class="ph" alt="Photo de '+escA(name)+'" src="'+photo+'" style="object-fit:cover">':'<div class="ph" aria-hidden="true">'+esc(name.charAt(0).toUpperCase())+'</div>')
+'<h1>'+esc(name)+badgeOf(name)+'</h1>'
+(bio?'<p class="bio2">'+esc(bio)+'</p>':'<p class="note">Cet artiste n\'a pas encore écrit sa biographie.</p>')
+'<div class="stats2"><div><b>'+songs.length+'</b><small>chansons</small></div><div><b>'+albums.length+'</b><small>albums</small></div><div><b>'+sales+'</b><small>ventes</small></div>'+(r.pos?'<div><b>#'+r.pos+'</b><small>Top du mois</small></div>':'')+'</div>';
document.getElementById("songs").innerHTML=songs.length?songs.map(function(x){var feat=x.sp&&x.sp.length>1?' · feat. '+x.sp.slice(1).map(function(s){return esc(s.n)}).join(', '):'';
return '<div class="item">'+cover(x)+'<div class="tx"><b>'+esc(x.t)+'</b><small>'+esc(x.a)+badgeOf(x.a)+feat+' · '+F(x.pr||200)+'</small></div><a class="tag" href="index.html#catalogue">Écouter</a></div>'}).join(""):'<p class="note">Aucune chanson pour le moment.</p>';
document.getElementById("albums").innerHTML=albums.length?albums.map(function(al){return '<div class="item">'+(al.cv&&al.cv.indexOf("data:image/")===0?'<img class="cv" alt="" src="'+al.cv+'">':'<div class="cv" aria-hidden="true">'+esc(al.t.charAt(0).toUpperCase())+'</div>')+'<div class="tx"><b>'+esc(al.t)+'</b><small>'+al.tracks.length+' titre(s) · '+F(al.pr)+'</small></div><a class="tag" href="index.html#decouverte">Acheter</a></div>'}).join(""):'<p class="note">Aucun album pour le moment.</p>';
var nx=(S.songs||[]).filter(function(x){return x.own&&x.a===name&&x.rel&&x.rel>now});
document.getElementById("nextSec").hidden=!(isMe&&nx.length);
document.getElementById("next").innerHTML=nx.map(function(x){return '<div class="next"><b>'+esc(x.t)+'</b> · sortie le '+new Date(x.rel).toLocaleString("fr-FR")+'</div>'}).join("");
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function drawAvis(){
var list=((S.reviews||{})[name])||[];
var avg=list.length?list.reduce(function(s,r){return s+r.n},0)/list.length:0;
document.getElementById("avgBox").innerHTML=list.length?'<p><b>'+avg.toFixed(1).replace(".",",")+' ★</b> · '+list.length+' avis</p>':'<p class="note">Pas encore d\'avis.</p>';
document.getElementById("avisList").innerHTML=list.slice().sort(function(a,b){return b.at-a.at}).slice(0,30).map(function(r){return '<div class="item" style="display:block"><b>'+esc(r.name)+'</b> <span style="color:#E4B23C">'+'★'.repeat(r.n)+'</span><small> · '+new Date(r.at).toLocaleDateString("fr-FR")+'</small><p style="margin:6px 0 0">'+esc(r.t)+'</p></div>'}).join("");
var f=document.getElementById("avisForm");
if(!S.user){f.innerHTML='<p class="note">Connectez-vous pour laisser un avis.</p>';return}
if(isMe){f.innerHTML='<p class="note">Vous ne pouvez pas noter votre propre profil.</p>';return}
var mine=list.filter(function(r){return r.mail===S.user.mail})[0];
f.innerHTML='<div class="box"><b>'+(mine?'Modifier votre avis':'Laisser un avis')+'</b><label for="avN">Note</label><select id="avN">'+[5,4,3,2,1].map(function(n){return '<option value="'+n+'"'+((mine?mine.n:5)===n?' selected':'')+'>'+n+' ★</option>'}).join("")+'</select><label for="avT">Votre avis (300 caractères max)</label><textarea id="avT" rows="3" maxlength="300">'+esc(mine?mine.t:"")+'</textarea><div class="row"><button id="avBtn">Publier mon avis</button></div><p class="note" style="margin-top:10px">Vous avez aimé ? <a href="index.html#catalogue">Écoutez ses chansons</a>.</p></div>';
document.getElementById("avBtn").onclick=function(){var tx=document.getElementById("avT").value.trim(),n=+document.getElementById("avN").value;
if(!tx){alert("Écrivez votre avis.");return}
S.reviews=S.reviews||{};S.reviews[name]=(S.reviews[name]||[]).filter(function(r){return r.mail!==S.user.mail});
S.reviews[name].push({mail:S.user.mail,name:S.user.name,n:n,t:tx.slice(0,300),at:Date.now()});save();drawAvis();};
}
render();drawAvis();
</script>
</body>
</html>
