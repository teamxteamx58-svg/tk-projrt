<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BASSARI-ZIK</title>
<meta name="description" content="La musique d'ici, soutenue par ceux d'ici.">
<meta name="theme-color" content="#0E3B34">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BASSARI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EC;--ink:#12201D;--mute:#4D6360;--card:#fff;--line:#CBD6CF;--forest:#0E3B34;--gold:#E4B23C;--red:#C8372D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1F1C;--ink:#EAF1EC;--mute:#9DB3AE;--card:#10302B;--line:#24473F;--forest:#071513}}
:root[data-theme="dark"]{--bg:#0B1F1C;--ink:#EAF1EC;--mute:#9DB3AE;--card:#10302B;--line:#24473F;--forest:#071513}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0 0 .5em}
a{color:inherit}.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--forest);color:#fff}
header .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{font:800 20px "Bricolage Grotesque",sans-serif;letter-spacing:.5px;margin-right:auto;color:var(--gold)}
nav a{color:#fff;text-decoration:none;margin-right:12px;font-size:15px}
button,.btn{font:600 15px "Source Sans 3",sans-serif;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--gold);color:#12201D}
button.alt{background:transparent;color:inherit;border:1.5px solid currentColor}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hero{background:var(--forest);color:#fff;padding:34px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:center}
.hero h1{font-size:clamp(34px,7vw,56px);font-weight:800}
.hero p{color:#cfe0da;max-width:46ch}
.disc{width:200px;height:200px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),#1d4a42 0);display:grid;place-items:center}
.disc div{width:150px;height:150px;border-radius:50%;background:var(--forest);display:grid;place-items:center;text-align:center;font:800 15px "Bricolage Grotesque";color:var(--gold);padding:10px}
section{padding:28px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.stats span{background:rgba(255,255,255,.1);padding:6px 12px;border-radius:99px;font-size:14px}
.price{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.box b.n{font:800 28px "Bricolage Grotesque";display:block}
.song{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;flex-wrap:wrap}
.song .t{flex:1 1 180px;min-width:0}.song .t b{display:block}.song small{color:var(--mute)}
.cv{width:64px;height:64px;border-radius:10px;flex:none;object-fit:cover;background:linear-gradient(135deg,var(--forest),#2a7a6b);display:grid;place-items:center;font:800 26px "Bricolage Grotesque",sans-serif;color:var(--gold)}
.gold{background:var(--gold);color:#12201D;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
dialog{border:0;border-radius:14px;max-width:420px;width:calc(100% - 28px);padding:20px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pol li{margin-bottom:8px}.pol ol{padding-left:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9;border:1px solid var(--gold)}
.note{font-size:14px;color:var(--mute)}
textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.toolbar input{flex:1 1 220px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px}
.chip.on{background:var(--gold);color:#12201D;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.card .cv{width:100%;height:auto;aspect-ratio:1;border-radius:10px;font-size:72px}
.card .cb{padding-top:10px;display:flex;flex-direction:column;gap:4px}
.card .ttl b{font:800 18px "Bricolage Grotesque",sans-serif}
.card .art{font-weight:600;color:var(--mute)}
.bio{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0;font-size:14px;color:var(--mute)}
.cr{color:var(--mute)}
.vote{display:flex;gap:8px;margin-top:6px}
.vote button{padding:6px 12px}.vote button.on{background:var(--gold);color:#12201D;border-color:var(--gold)}
.cmp{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.cmi p{margin:2px 0 8px}
#pbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--forest);color:#fff;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#pbar[hidden]{display:none}#pbar audio{flex:1 1 220px;min-width:0;height:36px}#pnow{font-weight:600;font-size:14px}
.railbox{background:var(--forest);color:#fff;padding:6px 0 26px}
.railbox h2{font-size:20px;color:var(--gold)}
.rail{overflow:hidden}
.track{display:flex;gap:14px;width:max-content;animation:slide var(--d,40s) linear infinite}
.rail:hover .track,.rail:focus-within .track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.tile{background:none;border:0;padding:0;width:120px;text-align:left;color:#fff;flex:none}
.tile .cv{width:120px;height:120px;border-radius:12px;font-size:44px}
.tile b{display:block;font:600 14px/1.2 "Source Sans 3",sans-serif;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{color:#cfe0da}
@media(prefers-reduced-motion:reduce){.rail{overflow-x:auto}.track{animation:none}}
@media(max-width:640px){.hero .wrap{grid-template-columns:1fr}.disc{width:150px;height:150px}.disc div{width:112px;height:112px;font-size:12px}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style>
<style>
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:22px}
.ev img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.noimg{width:100%;aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,var(--forest),#2a7a6b);color:var(--gold);font:800 80px "Bricolage Grotesque",sans-serif}
.evb{padding:16px 18px}
.evb h2{font-size:26px;margin:0 0 6px}
.evb p{margin:4px 0;color:var(--mute)}
.btn{display:inline-block;margin-top:8px;background:var(--gold);color:#12201D;text-decoration:none;font-weight:600;border-radius:8px;padding:10px 16px}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html" style="text-decoration:none">BASSARI-ZIK</a><nav><a href="index.html">Accueil</a><a href="artistes.html">Guide artiste</a><a href="politique.html">Politique</a></nav></div></header>
<main class="wrap" style="padding-top:24px;padding-bottom:60px">
<h1>Billets en photos</h1>
<p class="note">Les événements à venir, avec la photo de la salle ou du spectacle. Pour acheter un billet, cliquez sur le bouton : vous serez redirigé vers la billetterie du site.</p>
<div id="list" style="margin-top:20px"></div>
</main>
<footer class="wrap note" style="padding-bottom:40px">BASSARI-ZIK · <a href="index.html">Retour à l'accueil</a></footer>
<script>
var KEY="bassarizik1";
var S={};try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function F(n){return n.toLocaleString("fr-FR")+" F"}
var evs=(S.events||[]).filter(function(e){return new Date(e.date+"T23:59:59")>=new Date()});
var h="";
evs.forEach(function(e){var left=e.cap-e.sold;
h+='<article class="ev">'+(e.cv&&e.cv.indexOf("data:image/")===0?'<img src="'+e.cv+'" alt="Photo de '+esc(e.t)+'">':'<div class="noimg">'+esc(e.t.charAt(0).toUpperCase())+'</div>')+
'<div class="evb"><h2>'+esc(e.t)+'</h2><p>'+esc(e.a)+' · '+esc(e.place)+'</p><p>'+new Date(e.date).toLocaleDateString("fr-FR")+' · '+F(e.price)+' · '+(left>0?left+' places restantes':'Complet')+'</p>'+
'<a class="btn" href="index.html#billetterie">'+(left>0?'Acheter un billet':'Voir la billetterie')+'</a></div></article>'});
document.getElementById("list").innerHTML=h||'<p class="note">Aucun événement pour le moment.</p>';
</script>
</body>
</html>
